name: Docker-Image

# Baut das App-Image und legt es in der GitHub Container Registry ab.
# Der Server holt neue Images selbst ab (Komodo Auto-Update), deshalb braucht
# dieser Workflow keine Repo-Secrets - nur das eingebaute GITHUB_TOKEN.
#
# Tags:
#   main          -> :latest und :sha-<kurz>
#   Pull Request  -> :pr-<nummer> und :sha-<kurz>  (zum Testen vor dem Merge)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR verlangt Kleinbuchstaben
  IMAGE: ghcr.io/asta-th-mannheim/ausleihsystem

jobs:
  build:
    runs-on: ubuntu-latest
    # Pull Requests aus Forks bekommen kein Schreibrecht auf die Registry
    env:
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=sha,format=short

      - name: Bauen und hochladen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
